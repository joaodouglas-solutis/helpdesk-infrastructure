services:

  postgres:
    image: postgres:18
    container_name: helpdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: helpdesk-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: helpdesk-user-service
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/user_db
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  ticket-service:
    build:
      context: ../ticket-service
      dockerfile: Dockerfile
    container_name: helpdesk-ticket-service
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/ticket_db
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      USER_SERVICE_URL: http://user-service:8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: helpdesk-notification-service
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/notification_db
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: helpdesk-api-gateway
    restart: unless-stopped
    environment:
      USER_SERVICE_URL: http://user-service:8081
      TICKET_SERVICE_URL: http://ticket-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_started
      ticket-service:
        condition: service_started
      notification-service:
        condition: service_started
volumes:
  postgres_data:
  rabbitmq_data: